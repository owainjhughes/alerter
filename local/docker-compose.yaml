name: alerter-local

services:
  api:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        SERVICE: api
    environment:
      ALERTER_ENV: dev
      ALERTER_HTTP_ADDR: ":8080"
      ALERTER_LOG_FORMAT: text
      ALERTER_LOG_LEVEL: info
    expose:
      - "8080"
    restart: unless-stopped

  checker:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        SERVICE: checker
    environment:
      ALERTER_HTTP_ADDR: ":8080"
      ALERTER_LOG_FORMAT: text
      ALERTER_SINK_URL: http://evaluator:8080
    ports:
      # published only so the M2 demo can POST a check.requested from the host
      - "8091:8080"
    restart: unless-stopped

  evaluator:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        SERVICE: evaluator
    environment:
      ALERTER_HTTP_ADDR: ":8080"
      ALERTER_LOG_FORMAT: text
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alerter
      POSTGRES_PASSWORD: alerter
      POSTGRES_DB: alerter
    ports:
      # 5433 on host avoids clashing with a local Postgres; containers use postgres:5432.
      - "${ALERTER_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerter -d alerter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --mode=dev-container
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
