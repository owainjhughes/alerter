apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alerter-api
  namespace: alerter
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
        autoscaling.knative.dev/target: "10"
    spec:
      containers:
        - image: dev.local/alerter-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ALERTER_LOG_FORMAT
              value: text
          readinessProbe:
            httpGet:
              path: /readyz
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
