apiVersion: sources.knative.dev/v1
kind: PingSource
metadata:
  name: demo-monitor
  namespace: alerter
spec:
  schedule: "* * * * *"
  contentType: application/json
  data: '{"monitorId":"m-demo","name":"demo-down","type":"http","target":"http://nonexistent.invalid","timeoutSeconds":2,"expectedStatus":200,"consecutiveFailures":1}'
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: alerter
