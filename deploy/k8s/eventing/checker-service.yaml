apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: checker
  namespace: alerter
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containers:
        - image: dev.local/alerter-checker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ALERTER_LOG_FORMAT
              value: text
            - name: ALERTER_SINK_URL
              value: http://kafka-broker-ingress.knative-eventing.svc.cluster.local/alerter/alerter
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
