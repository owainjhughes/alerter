apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/owainjhughes/alerter
    targetRevision: main
    path: charts/alerter
  destination:
    server: https://kubernetes.default.svc
    namespace: alerter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
